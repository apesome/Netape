[package]
name = "netape-store"
version.workspace = true
edition.workspace = true
license.workspace = true

# Provides SQLite-backed storage for all app data (hosts, snippets, key pairs,
# tags, macros, keymaps, keyword highlights) plus a typed settings system.
# Uses rusqlite with manual migrations and a lightweight typed settings layer.

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
dirs.workspace = true
