# Build Netape installers for Windows, macOS, and Linux.
#
# Triggers:
#   - push of a version tag (v*)  → builds + creates a GitHub Release with the artifacts
#   - manual run (workflow_dispatch) → builds only; artifacts are downloadable
#     from the Actions run page (no Release is created since there's no tag).
#
# No code signing is configured. Unsigned binaries work but:
#   - Windows: SmartScreen will warn (user clicks "More info" → "Run anyway")
#   - macOS:   Gatekeeper will block (user right-clicks → Open, or
#              `xattr -dr com.apple.quarantine /Applications/Netape.app`)
#   - Linux:   no restrictions
#
# For a public repo the GitHub-hosted runners (windows-latest, macos-latest,
# ubuntu-22.04) are free with unlimited minutes.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # required by tauri-action to create/upload the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Netape uses a Cargo workspace at the repo root (src-tauri + crates/*),
          # so cache from the root, not from src-tauri.
          workspaces: ". -> target"

      - name: Install frontend deps
        run: npm ci

      # Linux only: Tauri's system dependencies (WebKitGTK etc.).
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Read release notes
        id: notes
        shell: bash
        # Replace the $VERSION placeholder with the tag name; fall back to the
        # raw file on manual (non-tag) runs.
        run: |
          if [ -f .github/RELEASE_NOTES.md ]; then
            body=$(sed "s/\$VERSION/${GITHUB_REF_NAME:-manual run}/g" .github/RELEASE_NOTES.md)
          else
            body="Netape build artifacts."
          fi
          {
            echo "body<<__EOF__"
            echo "$body"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag builds → publish to a Release; manual runs → just upload artifacts.
          tagName: ${{ github.ref_name }}
          releaseName: "Netape ${{ github.ref_name }}"
          # Multi-line markdown is passed via env to avoid YAML quoting issues.
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
